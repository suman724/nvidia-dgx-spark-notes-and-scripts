# open-webui-values.yaml
# Install into your existing "llm" namespace:
#   helm upgrade --install open-webui open-webui/open-webui -n llm -f open-webui-values.yaml

ollama:
  enabled: false

pipelines:
  enabled: false

persistence:
  enabled: true
  storageClass: local-path
  size: 10Gi

service:
  type: NodePort
  port: 8080
  nodePort: 30080

extraEnvVars:
  - name: OPENAI_API_BASE_URL
    value: "http://qwen3-4b-instruct-vllm.llm.svc.cluster.local:8000/v1"
  - name: OPENAI_API_KEY
    value: "sk-no-key"
  - name: WEBUI_AUTH
    value: "false"